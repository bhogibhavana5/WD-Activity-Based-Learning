<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #333;
        }

        /* Navigation Bar */
        header {
            background: #003366;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #ffcc00;
        }

        /* Banner */
        .banner {
            height: 400px;
            background: linear-gradient(
                rgba(0, 30, 70, 0.7),
                rgba(0, 30, 70, 0.7)
            ), url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            animation: fadeIn 2s;
        }

        .banner h2 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .banner button {
            background: #ffcc00;
            color: #003366;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .banner button:hover {
            background: white;
        }

        /* Sections */
        section {
            padding: 50px 8%;
            text-align: center;
        }

        section h2 {
            color: #003366;
            margin-bottom: 30px;
            font-size: 32px;
        }

        /* Information Cards */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .card h3 {
            color: #0055aa;
            margin-bottom: 15px;
        }

        .card p {
            line-height: 1.6;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* Admission */
        .admission {
            background: #e6f0ff;
        }

        /* Contact */
        .contact {
            background: #003366;
            color: white;
        }

        .contact h2 {
            color: white;
        }

        .contact p {
            margin: 12px;
            font-size: 17px;
        }

        /* Footer */
        footer {
            background: #001a33;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Navigation */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            nav {
                margin-top: 15px;
            }

            nav a {
                display: inline-block;
                margin: 8px;
                font-size: 14px;
            }

            .banner h2 {
                font-size: 30px;
            }

            .banner p {
                font-size: 16px;
            }

            section h2 {
                font-size: 25px;
            }
        }
    </style>
</head>
