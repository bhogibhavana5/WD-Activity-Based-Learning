
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Portfolio Website</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

/* Navigation */
header {
    background: #1e293b;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #38bdf8;
}

nav {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    transition: 0.3s;
}

nav a:hover,
nav a.active {
    color: #38bdf8;
}

/* Home */
.home {
    height: 90vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    animation: fadeIn 2s;
}

.home h1 {
    font-size: 45px;
}

.home span {
    color: #38bdf8;
}

.home h2 {
    margin: 15px;
}

.home p {
    margin: 15px;
}

.btn {
    display: inline-block;
    background: #38bdf8;
    color: #0f172a;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    margin-top: 15px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: white;
    transform: scale(1.1);
}

/* Sections */
section {
    padding: 70px 8%;
    text-align: center;
}

section h2 {
    color: #38bdf8;
    margin-bottom: 30px;
    font-size: 30px;
}

/* Cards */
.card {
    background: #1e293b;
    padding: 25px;
    margin: 20px auto;
    max-width: 750px;
    border-radius: 12px;
    transition: 0.4s;
    animation: slideUp 1s;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 20px #38bdf8;
}

.card h3 {
    color: #38bdf8;
    margin-bottom: 15px;
}

.card p {
    color: #cbd5e1;
    line-height: 1.8;
}

/* Skills and Hobbies */
.skills-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px;
}

.skill {
    background: #1e293b;
    color: #38bdf8;
    padding: 18px 30px;
    border: 1px solid #38bdf8;
    border-radius: 10px;
    transition: 0.3s;
}

.skill:hover {
    background: #38bdf8;
    color: #0f172a;
    transform: scale(1.1);
}

/* Contact */
#contact a {
    color: #38bdf8;
    text-decoration: none;
}

/* Footer */
footer {
    background: #1e293b;
    padding: 20px;
    text-align: center;
    color: #cbd5e1;
}

/* Animations */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Responsive Design */
@media (max-width: 768px) {
    header {
        flex-direction: column;
        gap: 20px;
    }

    nav {
        justify-content: center;
    }

    .home h1 {
        font-size: 30px;
    }

    section {
        padding: 50px 5%;
    }
}

@media (max-width: 480px) {
    nav {
        gap: 10px;
    }

    .skill {
        width: 100%;
    }
}
</style>
</head>
