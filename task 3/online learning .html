<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - E-Learning Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #333;
        }

        /* Navigation */
        header {
            background: #172554;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Banner */
        .banner {
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .banner h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .banner p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .banner button {
            padding: 12px 25px;
            background: #facc15;
            color: #172554;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Categories */
        .categories {
            text-align: center;
            padding: 40px 20px;
        }

        .categories h2 {
            margin-bottom: 25px;
            color: #172554;
        }

        .category-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .category {
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 3px 10px #ddd;
            cursor: pointer;
            transition: 0.3s;
        }

        .category:hover {
            background: #0284c7;
            color: white;
            transform: translateY(-5px);
        }

        /* Courses */
        .courses {
            padding: 40px 8%;
        }

        .courses h2 {
            text-align: center;
            margin-bottom: 35px;
            color: #172554;
            font-size: 30px;
        }

        .course-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .course-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .course-card:hover {
            transform: translateY(-8px);
        }

        .course-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .course-content {
            padding: 20px;
        }

        .course-content h3 {
            color: #172554;
            margin-bottom: 10px;
        }

        .course-content p {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .instructor {
            color: #0284c7;
            font-weight: bold;
        }

        .objectives {
            margin: 15px 0;
            padding-left: 20px;
            font-size: 14px;
        }

        .objectives li {
            margin: 7px 0;
        }

        /* Progress */
        .progress-section {
            margin: 15px 0;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #22c55e;
            border-radius: 10px;
        }

        /* Enrollment Button */
        .enroll-btn {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .enroll-btn:hover {
            background: #172554;
        }

        /* About */
        .about {
            text-align: center;
            padding: 60px 10%;
            background: #e0f2fe;
        }

        .about h2 {
            color: #172554;
            margin-bottom: 20px;
        }

        .about p {
            line-height: 1.8;
            font-size: 16px;
        }

        /* Footer */
        footer {
            background: #172554;
            color: white;
            text-align: center;
            padding: 25px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
            }

            nav {
                margin-top: 15px;
            }

            .banner h2 {
                font-size: 30px;
            }

            .courses {
                padding: 30px 5%;
            }
        }
    </style>
</head>
